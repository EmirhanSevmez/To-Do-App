<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js?v=3"></script>
    <script src="auth.js" defer></script>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <h1>Welcome to To-Do App</h1>
    <h3>Author: Emirhan Sevmez</h3>
    <div id="add-todo">
        <label for="task">Task:</label>
        <input type="text" id="task" name="task" placeholder="Hack NASA">
        <button id="add-button">Add To-Do</button>
    </div>
    <div id="search_input">
        <label for="search">Search:</label>
        <input type="text" id="search" name="search" placeholder="Search tasks...">
        <button id="search-button">Search</button>
    </div>

    <div id="todo_table"></div>

</body>

</html>
