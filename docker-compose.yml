services:
  db:
    container_name: todo-database
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_DB=tododb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin1234
    networks:
      - apiprogram
  api:
    container_name: todo-api
    build:
      context: .
    ports:
      - 8080:8080
    restart: always
    depends_on:
      - db
    networks:
      - apiprogram

networks:
  apiprogram: