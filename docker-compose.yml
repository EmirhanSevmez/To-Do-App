services:
  database:
    container_name: database
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=tododb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin1234
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: ../dev.backend.Dockerfile
    ports:
      - 8080:8080
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=admin1234
      - DB_NAME=tododb

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: ../dev.frontend.Dockerfile
    ports:
      - 3000:80
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
